name: publish

on: workflow_dispatch # Ermöglicht das manuelle Starten des Workflows

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
      - run: npm install
      - run: npm pack

  publish-npm:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          scope: "@ihk-gfi"
          always-auth: true
      - name: Update npm
        run: npm install -g npm@latest
      - name: Publish NPM
        run: |
          npm install
          npm pack
          ls -l
          npm publish
